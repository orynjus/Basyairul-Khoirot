        body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        @font-face {
            font-family: 'LPMQ IsepMisbah';
            src: url('lpmq.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        .arabic-text { font-family: 'LPMQ IsepMisbah', serif; }
        .rotate-180 { transform: rotate(180deg); }
        .hidden-dot { 
            display: none !important; 
            visibility: hidden !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            font-size: 0 !important;
            line-height: 0 !important;
        }
                       // 0. PULL TO REFRESH
        let touchStartY = 0;
        let isRefreshing = false;
        
        document.addEventListener('touchstart', (e) => {
            if (window.pageYOffset === 0) {
                touchStartY = e.touches[0].clientY;
            }
        }, false);
        
        document.addEventListener('touchmove', (e) => {
            if (isRefreshing) return;
            
            if (window.pageYOffset === 0 && e.touches[0].clientY > touchStartY + 100) {
                isRefreshing = true;
                location.reload();
            }
        }, false);

            const sholawatData = {
                'mahallul-qiyam': {
                    title: 'Sholawat Mahallul Qiyam',
                    arabic: '<span class="hidden-dot"></span>يَا نَبِى سَلَامْ عَلَيْكَ ۩ يَا رَسُوْلْ سَلَامْ عَلَيْكَ<br><span class="hidden-dot"></span>يَا حَبِيْبْ سَلَامْ عَلَيْكَ ۩ صَلَوَاتُ اللهْ عَلَيْكَ<br><span class="hidden-dot"></span>اَشْرَقَ الْبَدْرُ عَلَيْنَا ۩ فَاخْتَفَتْ مِنْهُ الْبُدُوْرُ <br><span class="hidden-dot"></span>مِثْلَ حُسْنِكْ مَا رَأَيْنَا ۩ قَطُّ يَا وَجْهَ السُّرُوْرِ<br><span class="hidden-dot"></span>اَنْتَ شَمْسٌ اَنْتَ بَدْرٌ ۩ اَنْتَ نُوْرٌ فَوْقَ نُوْرِ <br><span class="hidden-dot"></span>اَنْتَ اِكْسِيْرٌ وَّغَالِى ۩ اَنْتَ مِصْبَاحُ الصُّدُوْرِ<br><span class="hidden-dot"></span>يَاحَبِيْبِيْ يَامُحَمَّدْ ۩ يَا عَرُوْسَ الخَافِقَيْنِ<br><span class="hidden-dot"></span>يَا مُؤَيَّدْ يَا مُمَجَّدْ ۩ يَا اِمَامَ القِبْلَتَيْنِ<br><span class="hidden-dot"></span>مَنْ رَآى وَجْهَكَ يَسْعَدْ ۩ يَا كَرِيْمَ الوَالِدَيْنِ <br><span class="hidden-dot"></span>حَوْضُكَ الصَّافِى الْمُبَرَّدْ ۩ وِرْدُنَا يَوْمَ النُّشُوْرِ<br><span class="hidden-dot"></span>مَا رَأَيْنَا الْعِيْسَ حَنَّتْ ۩ بِالسُّرَى اِلَّا اِلَيْكَ <br><span class="hidden-dot">.</span>وَاْلَغَمَامَةْ قَدْ اَظَلَّتْ ۩ وَالْمَلَا صَلُّوْا عَلَيْكَ',
                    artinya: 'Artinya: "Wahai Nabi, salam sejahtera untukmu, wahai Rasul salam sejahtera untukmu. Wahai Kekasih, salam sejahtera untukmu, shalawat (rahmat) Allah untukmu. Satu purnama telah terbit di atas kami, pudarlah jutaan purnama lain karenanya. Belum pernah kulihat seperti keelokanmu, wahai wajah yang gembira. Kau bak mentari, kau juga laksana purnama, kau cahaya di atas cahaya. Kau laksana obat segala guna (elixir) lagi mahal, kau adalah lentera hati. Wahai Kekasih, wahai Muhammad, wahai pengantin Timur dan Barat. Wahai Rasul yang diperkuat (oleh wahyu), wahai Nabi yang agung, wahai imam dua kiblat. Siapapun yang memandang wajahmu pasti bahagia, wahai manusia yang memiliki orang tua mulia. Telagamu berair jernih dan sejuk, yang kelak kami datangi pada hari kebangkitan. Belum pernah kami melihat unta peranakan unggul yang bersuara sambil berjalan malam hari, kecuali menuju kepadamu. Gumpalan awan menaungimu, semua makhuk mengucapkan shalawat untukmu."'
                },
                'ziarah-wali': {
                    title: 'Sholawat Ziarah Wali',
                    arabic: '<span class="hidden-dot">.</span>سَـــلاَمُ اللهِ يـَا سَـــادَةْ ۩ مِنَ الرَّحْمٰنِ يَغْـْشَاكُمْ<br> عِبَـــــادَ اللهِ جِـئْنَــاكُمْ ۩ قَـصَدْنَاكُمْ طَلَبْنَـاكُمْ<span class="hidden-dot">.</span><br> تُـعِــيـْنُوْنَــــا تُـغِــــيْثُوْنَــــا۩ بـهِمَّتِكُمْ وَجَــدْوَاكُـمْ <span class="hidden-dot">.</span><br>فَأَحْبُـوْنَـــــا وَأَعْـطُوْنَــــا ۩ عَـطَاَياكُمْ هَـــدَايَـاكُمْ<span class="hidden-dot">.</span><br> فَــــلاَ خَيَّـبْتُـمُوْا ظَـــنِّيْ ۩ فَحَــاشَاكُمْ وَحَاشَاكُمْ <span class="hidden-dot">.</span><br>سَــعِدْنَـــا إِذْ أَتَيْنــَاكُمْ ۩ وَفُزْنَــا حِيْنَ زُرْنَــــاكُمْ <span class="hidden-dot">.</span><br>فَـقـُوْمُوْا وَاشْفَعُوْا فِيْنَا ۩ إِلَى الرَّحْمٰنِ مَـوْلاَكُمْ <span class="hidden-dot">.</span><br>عَسَى نُحْظَى عَسَى نُعْطَى ۩ مَـزَايـَا مِنْ مَزَايـَاكُمْ<span class="hidden-dot">.</span><br> عَسَى نَظْرَةْ عَسَى رَحْمَـــةْ ۩ تَـغْشَـانَا وَتَـغْشَاكُمْ<span class="hidden-dot">.</span><br> سَــــلاَمُ اللهِ حَـيــَّــاكُـــمْ ۩ وَعـَيْنُ اللهِ تَـرْعَــاكُمْ<span class="hidden-dot">.</span><br> وَصَـــــلَّى اللهُ مـَوْلاَنَـــا ۩ وَسَـــــلَّمَ مَا أَتَـيْنَـــاكُـــــمْ<span class="hidden-dot">.</span><br> عَلَى الْمُخْـتَارِ شَـــافِعِنَــا ۩ وَمُـنْقـِذِنَـا وَإِيَّـــــاكُمْ<span class="hidden-dot">.</span>',
                    artinya: 'Artinya: "Shalawat ini dibaca saat ziarah kubur para wali Allah, sebagai doa untuk memohon pertolongan, berkah, dan syafaat dari para wali, serta memohon agar diberikan kemudahan dalam segala urusan dan dilindungi dari segala keburukan. Shalawat ini juga memohon agar diberikan kecintaan kepada Rasulullah SAW seperti para wali mencintainya, dan diberikan kemampuan untuk mengikuti jejak mereka dalam kebaikan dan ketaatan."'
                },
                'surah-yasin': {
                    title: 'Surah Yasin',
                    arabic: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br><br>يسٓ<br>وَالْقُرْآنِ الْحَكِيمِ<br>إِنَّكَ لَمِنَ الْمُرْسَلِينَ<br>عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ<br>تَنزِيلَ الْعَزِيزِ الرَّحِيمِ<br>لِتُنذِرَ قَوْمًا مَّا أُنذِرَ آبَاؤُهُمْ فَهُمْ غَافِلُونَ<br>لَقَدْ حَقَّ الْقَوْلُ عَلَىٰ أَكْثَرِهِمْ فَهُمْ لَا يُؤْمِنُونَ<br>إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلَالًا فَهِيَ إِلَى الْأَذْقَانِ فَهُم مُّقْحَمُونَ<br>وَجَعَلْنَا مِن بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لَا يُبْصِرُونَ<br>وَسَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ<br>إِنَّمَا تُنذِرُ مَنِ اتَّبَعَ الذِّكْرَ وَخَشِيَ الرَّحْمَٰنَ بِالْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٍ وَأَجْرٍ كَرِيمٍ<br>إِنَّا نَحْنُ نُحْيِي الْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا وَآثَارَهُمْ وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ فِي إِمَامٍ مُّبِينٍ<br>وَاضْرِبْ لَهُم مَّثَلًا أَصْحَابَ الْقَرْيَةِ إِذْ جَاءَهَا الْمُرْسَلُونَ<br>إِذْ أَرْسَلْنَا إِلَيْهِمُ اثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٍ فَقَالُوا إِنَّا إِلَيْكُم مُّرْسَلُونَ<br>قَالُوا مَا أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا وَمَا أَنزَلَ الرَّحْمَٰنُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا تَكْذِبُونَ<br>قَالُوا رَبُّنَا يَعْلَمُ إِنَّا إِلَيْكُمْ لَمُرْسَلُونَ<br>وَمَا عَلَيْنَا إِلَّا الْبَلَاغُ الْمُبِينُ<br>قَالُوا إِنَّا تَطَيَّرْنَا بِكُمْ لَئِن لَّمْ تَنتَهُوا لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ أَلِيمٌ<br>قَالُوا طَائِرُكُم مَّعَكُمْ أَئِن ذُكِّرْتُم بَلْ أَنتُمْ قَوْمٌ تُسْرِفُونَ<br>وَجَاءَ مِنْ أَقْصَى الْمَدِينَةِ رَجُلٌ يَسْعَىٰ قَالَ يَا قَوْمِ اتَّبِعُوا الْمُرْسَلِينَ<br>اتَّبِعُوا مَن لَّا يَسْأَلُكُمْ أَجْرًا وَهُم مُّهْتَدُونَ<br>وَمَا لِيَ لَا أَعْبُدُ الَّذِي فَطَرَنِي وَإِلَيْهِ تُرْجَعُونَ<br>أَأَتَّخِذُ مِن دُونِهِ آلِهَةً إِن يُرِدْنِ الرَّحْمَٰنُ بِضُرٍّ لَّا تُغْنِ عَنِّي شَفَاعَتُهُمْ شَيْئًا وَلَا يُنقِذُونِ<br>إِنِّي إِذًا لَّفِي ضَلَالٍ مُّبِينٍ<br>إِنِّي آمَنتُ بِرَبِّكُمْ فَاسْمَعُونِ<br>قِيلَ ادْخُلِ الْجَنَّةَ قَالَ يَا لَيْتَ قَوْمِي يَعْلَمُونَ<br>بِمَا غَفَرَ لِي رَبِّي وَجَعَلَنِي مِنَ الْمُكْرَمِينَ<br>وَمَا أَنزَلْنَا عَلَىٰ قَوْمِهِ مِن بَعْدِهِ مِن جُندٍ مِّنَ السَّمَاءِ وَمَا كُنَّا مُنزِلِينَ<br>إِن كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ خَامِدُونَ<br>يَا حَسْرَةً عَلَى الْعِبَادِ مَا يَأْتِيهِم مِّن رَّسُولٍ إِلَّا كَانُوا بِهِ يَسْتَهْزِئُونَ<br>أَلَمْ يَرَوْا كَمْ أَهْلَكْنَا قَبْلَهُم مِّنَ الْقُرُونِ أَنَّهُمْ إِلَيْهِمْ لَا يَرْجِعُونَ<br>وَإِن كُلٌّ لَّمَّا جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ<br>وَآيَةٌ لَّهُمُ الْأَرْضُ الْمَيْتَةُ أَحْيَيْنَاهَا وَأَخْرَجْنَا مِنْهَا حَبًّا فَمِنْهُ يَأْكُلُونَ<br>وَجَعَلْنَا فِيهَا جَنَّاتٍ مِّن نَّخِيلٍ وَأَعْنَابٍ وَفَجَّرْنَا فِيهَا الْعُيُونَ<br>لِيَأْكُلُوا مِن ثَمَرِهِ وَمَا عَمِلَتْهُ أَيْدِيهِمْ أَفَلَا يَشْكُرُونَ<br>سُبْحَانَ الَّذِي خَلَقَ الْأَزْوَاجَ كُلَّهَا مِمَّا تُنبِتُ الْأَرْضُ وَمِنْ أَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَ<br>وَآيَةٌ لَّهُمُ اللَّيْلُ نَسْلَخُ مِنْهُ النَّهَارَ فَإِذَا هُم مُّظْلِمُونَ<br>وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَا ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ<br>وَالْقَمَرَ قَدَّرْنَاهُ مَنَازِلَ حَتَّىٰ عَادَ كَالْعُرْجُونِ الْقَدِيمِ<br>لَا الشَّمْسُ يَنبَغِي لَهَا أَن تُدْرِكَ الْقَمَرَ وَلَا اللَّيْلُ سَابِقُ النَّهَارِ وَكُلٌّ فِي فَلَكٍ يَسْبَحُونَ<br>وَآيَةٌ لَّهُمْ أَنَّا حَمَلْنَا ذُرِّيَّتَهُمْ فِي الْفُلْكِ الْمَشْحُونِ<br>وَخَلَقْنَا لَهُم مِّمِّثْلِهِ مَا يَرْكَبُونَ<br>وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ<br>إِلَّا رَحْمَةً مِّنَّا وَمَتَاعًا إِلَىٰ حِينٍ<br>وَإِذَا قِيلَ لَهُمُ اتَّقُوا مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَ<br>وَمَا تَأْتِيهِم مِّنْ آيَةٍ مِّنْ آيَاتِ رَبِّهِمْ إِلَّا كَانُوا عَنْهَا مُعْرِضِينَ<br>وَإِذَا قِيلَ لَهُمْ أَنفِقُوا مِمَّا رَزَقَكُمُ اللَّهُ قَالَ الَّذِينَ كَفَرُوا لِلَّذِينَ آمَنُوا أَنُطْعِمُ مَن لَّوْ يَشَاءُ اللَّهُ أَطْعَمَهُ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ مُّبِينٍ<br>وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ<br>مَا يَنظُرُونَ إِلَّا صَيْحَةً وَاحِدَةً تَأْخُذُهُمْ وَهُمْ يَخِصِّمُونَ<br>فَلَا يَسْتَطِيعُونَ تَوْصِيَةً وَلَا إِلَىٰ أَهْلِهِمْ يَرْجِعُونَ<br>وَنُفِخَ فِي الصُّورِ فَإِذَا هُم مِّنَ الْأَجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَ<br>قَالُوا يَا وَيْلَتَنَا مَن بَعَثَنَا مِن مَّرْقَدِنَا هَٰذَا مَا وَعَدَ الرَّحْمَٰنُ وَصَدَقَ الْمُرْسَلُونَ<br>إِن كَانَتْ إِلَّا صَيْحَةً وَاحِدَةً فَإِذَا هُمْ جَمِيعٌ لَّدَيْنَا مُحْضَرُونَ<br>فَالْيَوْمَ لَا تُظْلَمُ نَفْسٌ شَيْئًا وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ<br>إِنَّ أَصْحَابَ الْجَنَّةِ الْيَوْمَ فِي شُغُلٍ فَاكِهُونَ<br>هُمْ وَأَزْوَاجُهُمْ فِي ظِلَالٍ عَلَى الْأَرَائِكِ مُتَّكِئُونَ<br>لَهُمْ فِيهَا فَاكِهَةٌ وَلَهُم مَّا يَدَّعُونَ<br>سَلَامٌ قَوْلًا مِّن رَّبٍّ رَّحِيمٍ<br>وَامْتَازُوا الْيَوْمَ أَيُّهَا الْمُجْرِمُونَ<br>أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي آدَمَ أَن لَّا تَعْبُدُوا الشَّيْطَانَ إِنَّهُ لَكُمْ عَدُوٌّ مُّبِينٌ<br>وَأَنِ اعْبُدُونِي هَٰذَا صِرَاطٌ مُّسْتَقِيمٌ<br>وَلَقَدْ أَضَلَّ مِنكُمْ جِبِلًّا كَثِيرًا أَفَلَمْ تَكُونُوا تَعْقِلُونَ<br>هَٰذِهِ جَهَنَّمُ الَّتِي كُنتُمْ تُوعَدُونَ<br>اصْلَوْهَا الْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَ<br>الْيَوْمَ نَخْتِمُ عَلَىٰ أَفْوَاهِهِمْ وَتُكَلِّمُنَا أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُوا يَكْسِبُونَ<br>وَلَوْ نَشَاءُ لَطَمَسْنَا عَلَىٰ أَعْيُنِهِمْ فَاسْتَبَقُوا الصِّرَاطَ فَأَنَّىٰ يُبْصِرُونَ<br>وَلَوْ نَشَاءُ لَمَسَخْنَاهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا اسْتَطَاعُوا مُّضِيًّا وَلَا يَرْجِعُونَ<br>وَمَن نُّعَمِّرْهُ نُنَكِّسْهُ فِي الْخَلْقِ أَفَلَا يَعْقِلُونَ<br>وَمَا عَلَّمْنَاهُ الشِّعْرَ وَمَا يَنبَغِي لَهُ إِنْ هُوَ إِلَّا ذِكْرٌ وَقُرْآنٌ مُّبِينٌ<br>لِّيُنذِرَ مَن كَانَ حَيًّا وَيَحِقَّ الْقَوْلُ عَلَى الْكَافِرِينَ<br>أَوَلَمْ يَرَوْا أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَا أَنْعَامًا فَهُمْ لَهَا مَالِكُونَ<br>وَذَلَّلْنَاهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَأْكُلُونَ<br>وَلَهُمْ فِيهَا مَنَافِعُ وَمَشَارِبُ أَفَلَا يَشْكُرُونَ<br>وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً لَعَلَّهُمْ يُنصَرُونَ<br>لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌ مُّحْضَرُونَ<br>فَلَا يَحْزُنكَ قَوْلُهُمْ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَ<br>أَوَلَمْ يَرَ الْإِنسَانُ أَنَّا خَلَقْنَاهُ مِن نُّطْفَةٍ فَإِذَا هُوَ خَصِيمٌ مُّبِينٌ<br>وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ<br>قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌ<br>الَّذِي جَعَلَ لَكُم مِّنَ الشَّجَرِ الْأَخْضَرِ نَارًا فَإِذَا أَنتُم مِّنْهُ تُوقِدُونَ<br>أَوَلَيْسَ الَّذِي خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ بِقَادِرٍ عَلَىٰ أَن يَخْلُقَ مِثْلَهُمْ بَلَىٰ وَهُوَ الْخَّلَّاقُ الْعَلِيمُ<br>إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ<br>فَسُبْحَانَ الَّذِي بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَإِلَيْهِ تُرْجَعُونَ',
                    artinya: 'Artinya: "Surah Yasin adalah surah ke-36 dalam Al-Qur\'an yang terdiri dari 83 ayat. Surah ini disebut juga "Qalbul Qur\'an" (hati Al-Qur\'an) karena mengandung inti ajaran Al-Qur\'an. Surah ini membahas tentang keesaan Allah, kenabian Muhammad, hari kebangkitan, dan kisah para rasul yang diutus kepada kaum yang kafir. Surah ini sangat dianjurkan untuk dibaca, terutama saat mengunjungi orang sakit atau dalam majelis takziyah."'
                },
                'tahlil': {
                    title: 'Bacaan Tahlil',
                    arabic: 'سْمِ اللهِ الرَّحْمنِ الرَّحِيْمِ<br><br> قُلْ هُوَ اللَّهُ أَحَدٌ اللَّهُ الصَّمَدُ لَمْ يَلِدْ وَلَمْ يُولَدْ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَد<br> لاَ إِلهَ إِلَّا اللهُ اَللهُ أَكْبَرْ وَلِلّهِ اْلحَمْدُ<br><br> قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ * مِن شَرِّ مَا خَلَقَ * وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ *<br>وَمِن شَرِّ النَّفَّـثَـتِ فِى الْعُقَدِ * وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ<br><br>لاَ إِلهَ إِلَّا اللهُ اَللهُ أَكْبَرْ وَلِلّهِ اْلحَمْدُ<br><br> قُلْ أَعُوذُ بِرَبِّ النَّاسِ مَلِكِ النَّاسِ إِلَهِ النَّاسِ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ مِنَ الْجِنَّةِ وَالنَّاسِ<br><br>لاَ إِلهَ إِلَّا اللهُ اَللهُ أَكْبَرْ وَلِلّهِ اْلحَمْدُ<br><br>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ<br>الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ الرَّحْمَٰنِ الرَّحِيمِ مَالِكِ يَوْمِ الدِّينِ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ أمِينْ<br><br>بِسْمِ اللهِ الرَّحْمنِ الرَّحِيْمِ ,,الم ذَلِكَ اْلكِتَابُ لاَرَيْبَ فِيْهِ هُدًى لِلْمُتَّقِيْنَ. اَلَّذِيْنَ يُؤْمِنُوْنَ بِالْغَيْبِ وَيُقِيْمُوْنَ الصَّلاَةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُوْنَ.وَالَّذِيْنَ يُؤْمِنُوْنَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالْاخِرَةِ هُمْ يُوْقِنُوْنَ. اُولئِكَ عَلَى هُدًى مِنْ رَبِّهِمْ وَاُولئِكَ هُمُ الْمُفْلِحُوْنَ. وَإِلهُكُمْ إِلهُ وَاحِدٌ لاَإِلهَ إِلاَّ هُوَ الرَّحْمنُ الرَّحِيْمُ اللهُ لاَ إِلَهَ اِلاَّ هُوَ اْلحَيُّ الْقَيُّوْمُ لاَتَأْخُذُه سِنَةٌ وَلاَنَوْمٌ. لَهُ مَافِى السَّمَاوَاتِ وَمَافِى اْلأَرْضِ مَنْ ذَالَّذِى يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَابَيْنَ أَيْدِيْهِمْ وَمَا خَلْفَهُمْ وَلاَيُحِيْطُوْنَ بِشَيْءٍ مِنْ عِلْمِهِ إِلاَّ بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَاْلأَرْضِ وَلاَ يَؤدُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيْمُ. لِلّهِ مَافِى السَّمَاوَاتِ وَمَا في اْلأَرْضِ وَإِنْ تُبْدُوْا مَافِى أَنْفُسِكُمْ أَوْ تُخْفُوْهُ يُحَاسِبْكُمْ بِهِ اللهِ فَيُغْفِرُ لِمَنْ يَشَاءُ وَيُعَذِّبُ مَنْ يَشَاءُ. وَاللهُ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ. امَنَ الرَّسُوْلُ بِمَا أُنْزِلَ اِلَيْهِ مِنْ رَبَّهِ وَالْمُؤْمِنُوْنَ. كُلٌّ امَنَ بِاللهِ وَمَلاَئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَنُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ وَقَالُوْا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيْرُ. لاَيُكَلِّفُ نَفْسًا إِلاَّ وُسْعَهَا لَهَا مَاكَسَبَتْ وَعَلَيْهَا مَااكْتَسَبَتْ رَبَّنَا لاَتُؤَاخِذْنَا إِنْ نَسِيْنَ أَوْ أَخْطَعْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِيْنَ مِنْ قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَالاَطَاقَةَ لَنَا بِه<br><br>وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا <br>أَنْتَ مَوْلاَنَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِيْنَ. إِرْحَمْنَا يَاأَرْحَمَ الرَّاحِمِيْنَ <br><br>أللّهمّ اصْرِفْ عَنَّا السُّوْءَ بِمَا شِئْتَ وَكَيْفَ شِئْتَ إِنَّكَ عَلَى مَاتَشَاءُ قَدِيْرُ 3<br><br>وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ عَلَيْكُمْ أَهْلَ الْبَيْتِ إِنَّهُ حَمِيْدٌ مَجِيْدٌ. إِنَّمَا يُرِيْدُ اللهُ لِيُذْهِبَ عَنْكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيْرًا. إِنَّ اللهَ وَمَلاَئِكَتَهُ يُصَلُّوْنَ عَلَى النَّبِي يَا أَيُّهَا الَّذِيْنَ أمَنُوْا صَلُّوْا عَلَيْهِ وَسَلِّمُوْا تَسْلِيْمَا.<br><br>أَللّهُمَّ صَلِّ أَفْضَلَ الصَّلاَةِ عَلَى أَسْعَدِ مَخْلُوْقَاتِكَ نُوْرِ الْهُدَى سَيِّدِنَا وَمَوْلاَناَ مُحَمَّدٍ وَعَلَى أَلِ سَيِّدِنَا مُحَمَّدْ. عَدَدَ مَعْلُوْمَاتِكَ وَمِدَادَ كَلِمَاتِكَ كُلَّمَا ذَكَرَكَ الذَّاكِرُوْنَ. وَغَفَلَ عَنْ ذِكْرِكَ الْغَافِلُوْنَ.<br><br>أَللّهُمَّ صَلِّ أَفْضَلَ الصَّلاَةِ عَلَى أَسْعَدِ مَخْلُوْقَاتِكَ شَمْسِ الضُّحَى سَيِّدِنَا وَمَوْلاَناَ مُحَمَّدٍ وَعَلَى أَلِ سَيِّدِنَا مُحَمَّدْعَدَدَ مَعْلُوْمَاتِكَ وَمِدَادَ كَلِمَاتِكَ كُلَّمَا ذَكَرَكَ الذَّاكِرُوْنَ. وَغَفَلَ عَنْ ذِكْرِكَ الْغَافِلُوْنَ<br><br>أَللّهُمَّ صَلِّ أَفْضَلَ*الصَّلاَةِ عَلَى أَسْعَدِ مَخْلُوْقَاتِكَ بَدْرِ الدُّجَى سَيِّدِنَا وَمَوْلاَناَ مُحَمَّدٍ وَعَلَى أَلِ سَيِّدِنَا مُحَمَّدْ. عَدَدَ مَعْلُوْمَاتِكَ وَمِدَادَ كَلِمَاتِكَ كُلَّمَا ذَكَرَكَ الذَّاكِرُوْنَ. وَغَفَلَ عَنْ ذِكْرِكَ الْغَافِلُوْنَ.<br><br>وَسَلِّمْ وَرَضِيَ اللهُ تَعَالَى عَنْ سَادَتِنَا أَصْحَابِ رَسُوْلِ اللهِ أَجْمَعِيْنَ. وَحَسْبُنَا الله وَنِعْمَ الْوَكِيْلُ نِعْمَ الْمَوْلَى وَنِعْمَ النَّصِيْرُ. وَلاَحَوْلَ وَلاَقُوَّةَ إِلاَّ بِاللهِ الْعَلِيِّ الْعَظِيْمِ<br><br>أَسْتَغْفِرُ اللهَ الْعَظِيْم 3<br><br>أَفْضَلُ الذِّكْرِ فَاعْلَمْ أَنَّهُ لاَإِلهَ إِلاَّ اللهُ حَيٌّ مَوْجُوْدٌ لاَإِلهَ إِلاَّ اللهُ حَيٌّ مَعْبُوْدٌ لاَإِلهَ إِلاَّ اللهُ حَيٌّ بَاقٍ ،<br><br>اَإِلهَ إِلاَّ اللهُ 100<br>لاَإِلهَ إِلاَّ اللهُ لاَإِلهَ إِلاَّ اللهُ<br>لاَإِلهَ إِلاَّ اللهُ مُحَمَّدٌ نَبِيُّ الله<br>لاَإِلهَ إِلاَّ اللهُ مُحَمَّدٌ رَسُوْلُ الله<br>أَللّهُمَّ صَلِّ عَلَى مُحَمَّدْ أَللّهُمَّ صَلِّ عَلَيْهِ وَسَلِّمْ<br>أَللّهُمَّ صَلِّ عَلَى مُحَمَّدْ يَارَبِّ صَلِّ عَلَيْهِ وَسَلِّمْ<br>صَلَّى اللهُ عَلَى مُحَمَّدْ صَلَّى اللهُ عَلَيْهِ وَسَلَّمْ<br><br>سبحَانَ الله وَبِحَمْدِهِ سُبْحَانَ اللهِ الْعَظِيْمِ 33<br>أَللّهُمَّ صَلِّ عَلَى حَبِيْبِكَ سَيِّدِنَا مُحَمَّدْ وَعَلَى الِهِ وَصَحْبِهِ وَسَلِّمْ<br>أَللّهُمَّ صَلِّ عَلَى حَبِيْبِكَ سَيِّدِنَا مُحَمَّدْ وَعَلَى الِهِ وَصَحْبِهِ وَبَارِكْ وَسَلِّمْ<br>أَللّهُمَّ صَلِّ عَلَى حَبِيْبِكَ سَيِّدِنَا مُحَمَّدْ وَعَلَى الِهِ وَصَحْبِهِ وَبَارِكْ وَسَلِّمْ أَجْمَعِيْنَ. الفاتحة'
                },
                'thibbil-qulub': {
                    title: 'Sholawat Thibbil Qulub',
                    arabic: 'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ، طِبّ الْقُلُوْبِ وَدَوَائِهَا، وَعَافِيَةِ الْأَبْدَانِ وَشِفَائِهَا، وَنُوْرِ الْأَبْصَارِ وَضِيَائِهَا، وَقُوْتِ الْأَرْوَاحِ وَغِذَائِهَا، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمْ',
                    artinya: 'Artinya: "Ya Allah, berikanlah shalawat kepada junjungan kami Muhammad, penawar hati dan obatnya, kesembulan jasad dan penyembuhnya, cahaya penglihatan dan penerangnya, kekuatan ruh dan makanannya, dan semoga shalawat tercurah kepada keluarga dan para sahabatnya."'
                },
                'munjiyat': {
                    title: 'Sholawat Munjiyat',
                    arabic: 'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ وَعَلَى آلِ سَيِّدِنَا مُحَمَّدٍ صَلَاةً تُنْجِيْنِي بِهَا مِنْ جَمِيْعِ الْأَهْوَالِ وَالْآفَاتِ وَتَقْضِيْ لِيْ بِهَا جَمِيْعَ الْحَاجَاتِ وَتُطَهِّرُنِيْ بِهَا مِنْ جَمِيْعِ السَّيِّئَاتِ وَتَرْفَعُنِيْ بِهَا عِنْدَكَ أَعْلَى الدَّرَجَاتِ وَتُبَلِّغُنِيْ بِهَا أَقْصَى الْغَايَاتِ مِنْ جَمِيْعِ الْخَيْرَاتِ فِي الْحَيَاةِ وَبَعْدَ الْمَمَاتِ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيْرٌ',
                    artinya: 'Artinya: "Ya Allah, berikanlah shalawat kepada junjungan kami Muhammad dan kepada keluarga junjungan kami Muhammad, shalawat yang dapat menyelamatkanku dari semua ketakutan dan bencana, memenuhi semua kebutuhanku, mensucikanku dari semua keburukan, mengangkat derajatku di sisi-Mu setinggi-tingginya, dan menggapai puncak dari semua kebaikan baik di dunia maupun setelah mati. Sesungguhnya Engkau Maha Kuasa atas segala sesuatu."'
                },
                'fatih': {
                    title: 'Sholawat Fatih',
                    arabic: 'اللَّهُمَّ صَلِّ وَسَلِّمْ وَبَارِكْ عَلَى سَيِّدِنَا مُحَمَّدٍ الْفَاتِحِ لِمَا أُغْلِقَ، وَالْخَاتِمِ لِمَا سَبَقَ، وَنَاصِرِ الْحَقِّ بِالْحَقِّ، وَالْهَادِيْ إِلَى صِرَاطِكَ الْمُسْتَقِيْمِ، وَعَلَى آلِهِ وَصَحْبِهِ حَقَّ قَدْرِهِ وَمِقْدَارِهِ الْعَظِيْمِ',
                    artinya: 'Artinya: "Ya Allah, limpahkan rahmat, keselamatan dan keberkahan kepada junjungan kami Muhammad, yang membuka apa yang tertutup, yang mengakhiri apa yang mendahului, penolong kebenaran dengan kebenaran, dan petunjuk kepada jalan lurus-Mu. Dan semoga tercurah kepada keluarga dan para sahabatnya sesuai dengan kedudukan dan kemuliaan-Nya yang agung."'
                },
                'doa-pagi': {
                    title: 'Doa Pagi Hari',
                    arabic: 'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، رَبِّنَا وَرَبُّ كُلِّ شَيْءٍ، لَا إِلَهَ إِلَّا هُوَ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذَا الْيَوْمِ وَشَرِّ مَا بَعْدَهُ',
                    artinya: 'Artinya: "Kami memasuki waktu pagi sedangkan segala kerajaan hanya milik Allah, Tuhan kami dan Tuhan segala sesuatu. Tiada tuhan selain Dia. Bagi-Nya kerajaan dan bagi-Nya pujian. Dia Maha Kuasa atas segala sesuatu. Wahai Tuhan, aku mohon kepada-Mu kebaikan hari ini dan kebaikan setelahnya, dan aku berlindung kepada-Mu dari keburukan hari ini dan keburukan setelahnya."'
                },
                'doa-petang': {
                    title: 'Doa Petang Hari',
                    arabic: 'أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، رَبِّنَا وَرَبُّ كُلِّ شَيْءٍ، لَا إِلَهَ إِلَّا هُوَ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، رَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذِهِ اللَّيْلَةِ وَخَيْرَ مَا بَعْدَهَا، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا',
                    artinya: 'Artinya: "Kami memasuki waktu petang sedangkan segala kerajaan hanya milik Allah, Tuhan kami dan Tuhan segala sesuatu. Tiada tuhan selain Dia. Bagi-Nya kerajaan dan bagi-Nya pujian. Dia Maha Kuasa atas segala sesuatu. Wahai Tuhan, aku mohon kepada-Mu kebaikan malam ini dan kebaikan setelahnya, dan aku berlindung kepada-Mu dari keburukan malam ini dan keburukan setelahnya."'
                },
                'doa-perlindungan': {
                    title: 'Doa Mohon Perlindungan',
                    arabic: 'بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ',
                    artinya: 'Artinya: "Dengan nama Allah yang tidak ada sesuatu pun yang membahayakan bersama nama-Nya di bumi maupun di langit, dan Dia Maha Mendengar lagi Maha Mengetahui." (Dibaca 3 kali)'
                },
                'doa-setelah-sholat': {
                    title: 'Doa Setelah Sholat',
                    arabic: 'اللَّهُمَّ أَعِنِّيْ عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ',
                    artinya: 'Artinya: "Ya Allah, bantulah aku untuk mengingat-Mu, bersyukur kepada-Mu, dan memperbaiki ibadahku kepada-Mu."'
                },
                'doa-mohon-ampunan': {
                    title: 'Doa Mohon Ampunan',
                    arabic: 'رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ',
                    artinya: 'Artinya: "Wahai Tuhan kami, ampunilah dosa-dosa kami dan tindakan kami yang melampaui batas dalam urusan kami, teguhkan pendirian kami dan tolonglah kami melawan kaum kafir."'
                },
            };

            function openModal(id) {
                const data = sholawatData[id];
                if (!data) return;

                const modal = document.getElementById('modal');
                const modalTitle = document.getElementById('modal-title');
                const modalContent = document.getElementById('modal-content');

                modalTitle.textContent = data.title;
                modalContent.innerHTML = `
                    <div class="bg-blue-50 rounded-lg p-3 sm:p-4 mb-4">
                        <h3 class="font-semibold text-slate-800 mb-2 sm:mb-3 text-base sm:text-lg">Teks Arab:</h3>
                        <p id="arabic-text-modal" class="arabic-text text-lg sm:text-xl text-right leading-loose bg-white p-3 sm:p-4 rounded border border-blue-200 transition-all">${data.arabic}</p>
                    </div>
                    <div id="translation-section" class="bg-green-50 rounded-lg p-3 sm:p-4 hidden">
                        <h3 class="font-semibold text-slate-800 mb-2 sm:mb-3 text-base sm:text-lg">Terjemahan:</h3>
                        <p class="text-slate-700 leading-relaxed text-sm sm:text-base">${data.artinya}</p>
                    </div>
                `;

                modal.classList.remove('hidden');
                modal.classList.add('flex', 'items-center', 'justify-center');
                document.body.style.overflow = 'hidden';
            }

            let currentFontSize = 1; // 1 = normal, 0.8 = kecil, 1.2 = besar
            let translationVisible = false; // default sembunyikan terjemahan

            function changeFontSize(action) {
                const arabicText = document.getElementById('arabic-text-modal');
                const display = document.getElementById('font-size-display');
                
                if (action === 'increase') {
                    if (currentFontSize < 1.4) {
                        currentFontSize += 0.2;
                    }
                } else if (action === 'decrease') {
                    if (currentFontSize > 0.6) {
                        currentFontSize -= 0.2;
                    }
                }
                
                arabicText.style.fontSize = `${1.25 * currentFontSize}rem`;
                
                // Update display text
                if (currentFontSize <= 0.8) {
                    display.textContent = 'Kecil';
                } else if (currentFontSize >= 1.2) {
                    display.textContent = 'Besar';
                } else {
                    display.textContent = 'Normal';
                }
            }

            function toggleTranslation() {
                const translationSection = document.getElementById('translation-section');
                const toggleBtn = document.getElementById('translation-toggle');
                const toggleText = document.getElementById('translation-text');
                const toggleIcon = document.getElementById('translation-icon');
                
                translationVisible = !translationVisible;
                
                if (translationVisible) {
                    translationSection.classList.remove('hidden');
                    toggleText.textContent = 'Sembunyikan Terjemahan';
                    toggleBtn.classList.remove('bg-amber-100', 'text-amber-800');
                    toggleBtn.classList.add('bg-green-100', 'text-green-800');
                    
                    // Change icon to eye-slash
                    toggleIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.94 17.94A10.07 10.07 0 0112 12c0 4.477 2.943 8.268 7 9.542a10.045 10.045 0 01-9.542 7z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1.5 12a10.07 10.07 0 011.5 0m0 0a10.07 10.07 0 01-1.5 0"></path>
                    `;
                } else {
                    translationSection.classList.add('hidden');
                    toggleText.textContent = 'Tampilkan Terjemahan';
                    toggleBtn.classList.remove('bg-green-100', 'text-green-800');
                    toggleBtn.classList.add('bg-amber-100', 'text-amber-800');
                    
                    // Change icon to eye
                    toggleIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    `;
                }
            }

            function closeModal() {
                const modal = document.getElementById('modal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = 'auto';
            }

            
            
            
            // Tutup modal saat klik di luar modal
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            // Tutup modal dengan tombol Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });

            // Pull to Refresh functionality
            let startY = 0;
            let currentY = 0;
            let isPulling = false;
            let canRefresh = false;
            const pullThreshold = 80;
            const refreshIndicator = document.getElementById('pull-to-refresh');

            document.addEventListener('touchstart', function(e) {
                if (window.scrollY === 0) {
                    startY = e.touches[0].clientY;
                    isPulling = true;
                    refreshIndicator.classList.add('show');
                }
            });

            document.addEventListener('touchmove', function(e) {
                if (!isPulling) return;
                
                currentY = e.touches[0].clientY;
                const pullDistance = currentY - startY;
                
                if (pullDistance > 0) {
                    e.preventDefault();
                    
                    if (pullDistance >= pullThreshold) {
                        canRefresh = true;
                        refreshIndicator.classList.add('pulling');
                        refreshIndicator.querySelector('.pull-text').textContent = 'Lepaskan untuk refresh';
                        refreshIndicator.querySelector('.pull-to-refresh-icon').textContent = '↻';
                    } else {
                        canRefresh = false;
                        refreshIndicator.classList.remove('pulling');
                        refreshIndicator.querySelector('.pull-text').textContent = 'Tarik ke bawah untuk refresh';
                        refreshIndicator.querySelector('.pull-to-refresh-icon').textContent = '↓';
                    }
                    
                    const translateY = Math.min(pullDistance * 0.5, 60);
                    refreshIndicator.style.transform = `translateX(-50%) translateY(${translateY}px)`;
                }
            });

            document.addEventListener('touchend', function(e) {
                if (!isPulling) return;
                
                isPulling = false;
                
                if (canRefresh) {
                    // Perform refresh
                    refreshIndicator.querySelector('.pull-text').textContent = 'Menyegarkan...';
                    refreshIndicator.querySelector('.pull-to-refresh-icon').textContent = '↻';
                    
                    // Add spinning animation
                    refreshIndicator.classList.add('pulling');
                    
                    setTimeout(() => {
                        window.location.reload();
                    }, 500);
                } else {
                    // Reset indicator
                    refreshIndicator.style.transform = 'translateX(-50%) translateY(-60px)';
                    refreshIndicator.classList.remove('pulling', 'show');
                }
            });

            // Reset on scroll
            window.addEventListener('scroll', function() {
                if (window.scrollY > 0 && isPulling) {
                    isPulling = false;
                    refreshIndicator.style.transform = 'translateX(-50%) translateY(-60px)';
                    refreshIndicator.classList.remove('pulling', 'show');
                }
            });
        </script>

        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js')
                        .then((registration) => {
                            console.log('Service Worker registered:', registration.scope);
                        })
                        .catch((error) => {
                            console.warn('Service Worker registration failed:', error);
                        });
                });
            }
        </script>

        <div class="mt-12 text-center text-slate-600">
            <p class="text-sm">Semoga Allah menerima amal ibadah kita dan memberikan keberkahan-Nya.</p>
            <p class="text-sm mt-2">© 2026 PP. Raden Fatah Pekalongan</p>
        </div>
    </div>
</body>
