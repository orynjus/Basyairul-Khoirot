        <!-- Modal Popup -->

                <div class="p-4 sm:p-6">
                    <!-- Header Modal -->
                    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 space-y-3 sm:space-y-0">
                        <h2 id="modal-title" class="text-xl sm:text-2xl font-bold text-slate-800 text-center sm:text-left"></h2>
                        
                        <!-- Controls Container -->
                        <div class="flex flex-wrap justify-center sm:justify-end items-center gap-2 sm:gap-3">

                            <div class="flex items-center space-x-1 sm:space-x-2 bg-slate-100 rounded-lg px-2 sm:px-3 py-1.5 sm:py-2">
                                <span class="text-xs sm:text-sm font-medium text-slate-600 hidden sm:inline">Ukuran:</span>
                                <button onclick="changeFontSize('decrease')" class="w-8 h-8 sm:w-6 sm:h-6 bg-white hover:bg-slate-200 rounded flex items-center justify-center transition">
                                    <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 12l-4-4m0 8l4-4"></path>
                                    </svg>
                                </button>
                                <span id="font-size-display" class="text-xs sm:text-sm font-bold text-slate-800 min-w-[2.5rem] sm:min-w-[3rem] text-center">Normal</span>

                                    <svg class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 12l4-4m0 8l-4-4"></path>
                                    </svg>
                                </button>
                            </div>
                            
                            <!-- Toggle Terjemahan - Mobile Optimized -->
                            <button onclick="toggleTranslation()" id="translation-toggle" class="flex items-center space-x-1 sm:space-x-2 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg px-2 sm:px-3 py-1.5 sm:py-2 transition">
                                <svg id="translation-icon" class="w-3 h-3 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                </svg>

                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                </svg>
                            </button>

                    </div>

                            Tutup
                        </button>
                    </div>
                </div>
            </div>

        <script>
            // Data sholawat dan doa
            const sholawatData = {
                'mahallul-qiyam': {
                    title: 'Sholawat Mahallul Qiyam',
                    arabic: '<span class="hidden-dot"></span>يَا نَبِى سَلَامْ عَلَيْكَ ۩ يَا رَسُوْلْ سَلَامْ عَلَيْكَ<br><span class="hidden-dot"></span>يَا حَبِيْبْ سَلَامْ عَلَيْكَ ۩ صَلَوَاتُ اللهْ عَلَيْكَ<br><span class="hidden-dot"></span>اَشْرَقَ الْبَدْرُ عَلَيْنَا ۩ فَاخْتَفَتْ مِنْهُ الْبُدُوْرُ <br><span class="hidden-dot"></span>مِثْلَ حُسْنِكْ مَا رَأَيْنَا ۩ قَطُّ يَا وَجْهَ السُّرُوْرِ<br><span class="hidden-dot"></span>اَنْتَ شَمْسٌ اَنْتَ بَدْرٌ ۩ اَنْتَ نُوْرٌ فَوْقَ نُوْرِ <br><span class="hidden-dot"></span>اَنْتَ اِكْسِيْرٌ وَّغَالِى ۩ اَنْتَ مِصْبَاحُ الصُّدُوْرِ<br><span class="hidden-dot"></span>يَاحَبِيْبِيْ يَامُحَمَّدْ ۩ يَا عَرُوْسَ الخَافِقَيْنِ<br><span class="hidden-dot"></span>يَا مُؤَيَّدْ يَا مُمَجَّدْ ۩ يَا اِمَامَ القِبْلَتَيْنِ<br><span class="hidden-dot"></span>مَنْ رَآى وَجْهَكَ يَسْعَدْ ۩ يَا كَرِيْمَ الوَالِدَيْنِ <br><span class="hidden-dot"></span>حَوْضُكَ الصَّافِى الْمُبَرَّدْ ۩ وِرْدُنَا يَوْمَ النُّشُوْرِ<br><span class="hidden-dot"></span>مَا رَأَيْنَا الْعِيْسَ حَنَّتْ ۩ بِالسُّرَى اِلَّا اِلَيْكَ <br><span class="hidden-dot">.</span>وَاْلَغَمَامَةْ قَدْ اَظَلَّتْ ۩ وَالْمَلَا صَلُّوْا عَلَيْكَ',
                    artinya: 'Artinya: "Wahai Nabi, salam sejahtera untukmu, wahai Rasul salam sejahtera untukmu. Wahai Kekasih, salam sejahtera untukmu, shalawat (rahmat) Allah untukmu. Satu purnama telah terbit di atas kami, pudarlah jutaan purnama lain karenanya. Belum pernah kulihat seperti keelokanmu, wahai wajah yang gembira. Kau bak mentari, kau juga laksana purnama, kau cahaya di atas cahaya. Kau laksana obat segala guna (elixir) lagi mahal, kau adalah lentera hati. Wahai Kekasih, wahai Muhammad, wahai pengantin Timur dan Barat. Wahai Rasul yang diperkuat (oleh wahyu), wahai Nabi yang agung, wahai imam dua kiblat. Siapapun yang memandang wajahmu pasti bahagia, wahai manusia yang memiliki orang tua mulia. Telagamu berair jernih dan sejuk, yang kelak kami datangi pada hari kebangkitan. Belum pernah kami melihat unta peranakan unggul yang bersuara sambil berjalan malam hari, kecuali menuju kepadamu. Gumpalan awan menaungimu, semua makhuk mengucapkan shalawat untukmu."'
                },
                'ziarah-wali': {
                    title: 'Sholawat Ziarah Wali',
                    arabic: '<span class="hidden-dot">.</span>سَـــلاَمُ اللهِ يـَا سَـــادَةْ ۩ مِنَ الرَّحْمٰنِ يَغْـْشَاكُمْ<br> عِبَـــــادَ اللهِ جِـئْنَــاكُمْ ۩ قَـصَدْنَاكُمْ طَلَبْنَـاكُمْ<span class="hidden-dot">.</span><br> تُـعِــيـْنُوْنَــــا تُـغِــــيْثُوْنَــــا۩ بـهِمَّتِكُمْ وَجَــدْوَاكُـمْ <span class="hidden-dot">.</span><br>فَأَحْبُـوْنَـــــا وَأَعْـطُوْنَــــا ۩ عَـطَاَياكُمْ هَـــدَايَـاكُمْ<span class="hidden-dot">.</span><br> فَــــلاَ خَيَّـبْتُـمُوْا ظَـــنِّيْ ۩ فَحَــاشَاكُمْ وَحَاشَاكُمْ <span class="hidden-dot">.</span><br>سَــعِدْنَـــا إِذْ أَتَيْنــَاكُمْ ۩ وَفُزْنَــا حِيْنَ زُرْنَــــاكُمْ <span class="hidden-dot">.</span><br>فَـقـُوْمُوْا وَاشْفَعُوْا فِيْنَا ۩ إِلَى الرَّحْمٰنِ مَـوْلاَكُمْ <span class="hidden-dot">.</span><br>عَسَى نُحْظَى عَسَى نُعْطَى ۩ مَـزَايـَا مِنْ مَزَايـَاكُمْ<span class="hidden-dot">.</span><br> عَسَى نَظْرَةْ عَسَى رَحْمَـــةْ ۩ تَـغْشَـانَا وَتَـغْشَاكُمْ<span class="hidden-dot">.</span><br> سَــــلاَمُ اللهِ حَـيــَّــاكُـــمْ ۩ وَعـَيْنُ اللهِ تَـرْعَــاكُمْ<span class="hidden-dot">.</span><br> وَصَـــــلَّى اللهُ مـَوْلاَنَـــا ۩ وَسَـــــلَّمَ مَا أَتَـيْنَـــاكُـــــمْ<span class="hidden-dot">.</span><br> عَلَى الْمُخْـتَارِ شَـــافِعِنَــا ۩ وَمُـنْقـِذِنَـا وَإِيَّـــــاكُمْ<span class="hidden-dot">.</span>',
                    artinya: 'Artinya: "Shalawat ini dibaca saat ziarah kubur para wali Allah, sebagai doa untuk memohon pertolongan, berkah, dan syafaat dari para wali, serta memohon agar diberikan kemudahan dalam segala urusan dan dilindungi dari segala keburukan. Shalawat ini juga memohon agar diberikan kecintaan kepada Rasulullah SAW seperti para wali mencintainya, dan diberikan kemampuan untuk mengikuti jejak mereka dalam kebaikan dan ketaatan."'
                },
                'thibbil-qulub': {
                    title: 'Sholawat Thibbil Qulub',
                    arabic: 'اللَّهُمَّ صَلِّ عَلَى سَيِّدِنَا مُحَمَّدٍ، طِبّ الْقُلُوْبِ وَدَوَائِهَا، وَعَافِيَةِ الْأَبْدَانِ وَشِفَائِهَا، وَنُوْرِ الْأَبْصَارِ وَضِيَائِهَا، وَقُوْتِ الْأَرْوَاحِ وَغِذَائِهَا، وَعَلَى آلِهِ وَصَحْبِهِ وَسَلَّمْ',
                    artinya: 'Artinya: "Ya Allah, berikanlah shalawat kepada junjungan kami Muhammad, penawar hati dan obatnya, kesembulan jasad dan penyembuhnya, cahaya penglihatan dan penerangnya, kekuatan ruh dan makanannya, dan semoga shalawat tercurah kepada keluarga dan para sahabatnya."'
                },

            function openModal(id) {
                const data = sholawatData[id];
                if (!data) return;

                const modal = document.getElementById('modal');
                const modalTitle = document.getElementById('modal-title');
                const modalContent = document.getElementById('modal-content');

                modalTitle.textContent = data.title;
                modalContent.innerHTML = `
                    <div class="bg-blue-50 rounded-lg p-3 sm:p-4 mb-4">
                        <h3 class="font-semibold text-slate-800 mb-2 sm:mb-3 text-base sm:text-lg">Teks Arab:</h3>
                        <p id="arabic-text-modal" class="arabic-text text-lg sm:text-xl text-right leading-loose bg-white p-3 sm:p-4 rounded border border-blue-200 transition-all">${data.arabic}</p>
                    </div>
                    <div id="translation-section" class="bg-green-50 rounded-lg p-3 sm:p-4 hidden">
                        <h3 class="font-semibold text-slate-800 mb-2 sm:mb-3 text-base sm:text-lg">Terjemahan:</h3>
                        <p class="text-slate-700 leading-relaxed text-sm sm:text-base">${data.artinya}</p>
                    </div>
                `;

                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.style.overflow = 'hidden';
            }

            let currentFontSize = 1; // 1 = normal, 0.8 = kecil, 1.2 = besar
            let translationVisible = false; // default sembunyikan terjemahan

            function changeFontSize(action) {
                const arabicText = document.getElementById('arabic-text-modal');
                const display = document.getElementById('font-size-display');
                
                if (action === 'increase') {
                    if (currentFontSize < 1.4) {
                        currentFontSize += 0.2;
                    }
                } else if (action === 'decrease') {
                    if (currentFontSize > 0.6) {
                        currentFontSize -= 0.2;
                    }
                }
                
                arabicText.style.fontSize = `${1.25 * currentFontSize}rem`;
                
                // Update display text
                if (currentFontSize <= 0.8) {
                    display.textContent = 'Kecil';
                } else if (currentFontSize >= 1.2) {
                    display.textContent = 'Besar';
                } else {
                    display.textContent = 'Normal';
                }
            }

            function toggleTranslation() {
                const translationSection = document.getElementById('translation-section');
                const toggleBtn = document.getElementById('translation-toggle');
                const toggleText = document.getElementById('translation-text');
                const toggleIcon = document.getElementById('translation-icon');
                
                translationVisible = !translationVisible;
                
                if (translationVisible) {
                    translationSection.classList.remove('hidden');
                    toggleText.textContent = 'Sembunyikan Terjemahan';
                    toggleBtn.classList.remove('bg-amber-100', 'text-amber-800');
                    toggleBtn.classList.add('bg-green-100', 'text-green-800');
                    
                    // Change icon to eye-slash
                    toggleIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.94 17.94A10.07 10.07 0 0112 12c0 4.477 2.943 8.268 7 9.542a10.045 10.045 0 01-9.542 7z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1.5 12a10.07 10.07 0 011.5 0m0 0a10.07 10.07 0 01-1.5 0"></path>
                    `;
                } else {
                    translationSection.classList.add('hidden');
                    toggleText.textContent = 'Tampilkan Terjemahan';
                    toggleBtn.classList.remove('bg-green-100', 'text-green-800');
                    toggleBtn.classList.add('bg-amber-100', 'text-amber-800');
                    
                    // Change icon to eye
                    toggleIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    `;
                }
            }

            function closeModal() {
                const modal = document.getElementById('modal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = 'auto';
            }

            
            
            
            // Tutup modal saat klik di luar modal
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });

            // Tutup modal dengan tombol Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        </script>

        <div class="mt-12 text-center text-slate-600">
            <p class="text-sm">Semoga Allah menerima amal ibadah kita dan memberikan keberkahan-Nya.</p>

        </div>
